name: Generate CV HTML

on:
  push:
    branches:
      - master
      - builder-framing
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate-html:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install renderer and theme
        run: npm install resumed jsonresume-theme-onepage-plus

      - name: Generate CV HTML
        run: npx resumed render resume.json --theme jsonresume-theme-onepage-plus

      - name: Upload generated HTML
        uses: actions/upload-artifact@v4
        with:
          name: cv-${{ github.ref_name }}-${{ github.run_number }}
          path: resume.html
          if-no-files-found: error
